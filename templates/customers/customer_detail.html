{% extends "base.html" %}

{% block title %}{{ customer.name }} - Customer Detail{% endblock %}

{% block content %}
<div class="container">
    <!-- Header Section -->
    <div class="row my-4 align-items-center">
        <div class="col-md-6">
            <h2 class="mb-0">{{ customer.name }}</h2>
        </div>
        <div class="col-md-6 text-end">
            <a href="{% url 'customer_update' product.id %}" class="btn btn-primary">Edit</a>
            <a href="{% url 'customer_list' %}" class="btn btn-secondary">Back to Customers</a>
        </div>
    </div>

    <!-- Customer Information -->
    <div class="row my-4">
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Customer Information</h5>
                    <p class="card-text">{{ customer.vat_id }}</p>
                    <p class="card-text">{{ customer.city }}</p>
                    <p class="card-text">{{ customer.country }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
